spring:
  application:
    name: spotlight-itsm

  datasource:
    # Supabase: use the DIRECT connection (port 5432) or the session-mode pooler (5432).
    # Do NOT point Flyway at the transaction-mode pooler (6543) — migrations need a session.
    url: ${ITSM_DB_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
    username: ${ITSM_DB_USER:postgres}
    password: ${ITSM_DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate is only allowed to check that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway's history table lives inside `itsm`, never in `public`.
    schemas: itsm
    default-schema: itsm
    create-schemas: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Local Supabase (CLI default): HS256. Prod (new projects): ECC P-256 via JWKS.
          # Set JWKS_URI to prefer asymmetric, else falls back to secret-key.
          # Verified against this project: Supabase signs HS256. The secret is in
          # Supabase dashboard -> Settings -> API -> JWT Secret.
          # If the project is later migrated to asymmetric signing keys, replace this with
          # `jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json`.
          secret-key: ${SUPABASE_JWT_SECRET:}
          jwk-set-uri: ${SUPABASE_JWKS_URL:}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
